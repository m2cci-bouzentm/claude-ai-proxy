services:
  claude-proxy:
    build: .
    container_name: claude-ai-proxy
    ports:
      - "4181:4181"
    environment:
      - PROXY_AUTH_DIR=/data
    volumes:
      - ${PROXY_AUTH_DIR:-claude-proxy-data}:/data
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4181/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  claude-proxy-data:
